# /etc/nginx/sites-available/admin.hisp.tech
# Managed by: HISP Asset Management System

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name admin.hisp.tech;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name admin.hisp.tech;
    ssl_certificate     /etc/letsencrypt/live/admin.hisp.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.hisp.tech/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ─── Frontend (React) ────────────────────────────────────────
    root /var/www/admin.hisp.tech;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── API (NestJS) ────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://localhost:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        proxy_pass http://localhost:3000/uploads/;
        proxy_set_header Host $host;
    }

}
