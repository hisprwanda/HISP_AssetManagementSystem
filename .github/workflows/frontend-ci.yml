name: HISP-AMS Frontend CI

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './ams_web/package-lock.json' 

    - name: Install Dependencies
      run: npm ci
      working-directory: ./ams_web

    - name: Run Linter
      run: npm run lint
      working-directory: ./ams_web

    - name: Verify Production Build
      run: npm run build
      working-directory: ./ams_web

    - name: Test Docker Build
      run: docker build -t hisp-frontend-test:latest -f ./ams_web/Dockerfile ./ams_web