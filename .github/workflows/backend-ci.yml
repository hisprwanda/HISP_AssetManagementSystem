name: HISP-AMS Backend CI

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './ams_api/package-lock.json'

    - name: Install Dependencies
      run: npm ci
      working-directory: ./ams_api

    - name: Run Linter (Check for messy code)
      run: npm run lint
      working-directory: ./ams_api

    - name: Run Unit Tests (Verify business logic)
      run: npm run test -- --passWithNoTests
      working-directory: ./ams_api

    - name: Test Docker Build (Verify container works)
      run: docker build -t hisp-api-test:latest -f ./ams_api/Dockerfile ./ams_api